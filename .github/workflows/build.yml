name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Compile C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Rebirth.csproj --nologo -warnaserror:CS8602,CS8618
